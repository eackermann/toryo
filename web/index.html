<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toryo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- The logo: three blocks for the three kinds of work (blue builds, purple plans, mint reviews). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 512 512">
    <g transform="translate(256 256) scale(0.657142857143) translate(-129.903810567666 100)">
      <g style="opacity: var(--ob, 1)">
        <path fill="#3A9CFD" d="M-173.205,-100 L-86.603,-50 L86.603,-150 L0,-200 Z"/>
        <path fill="#2583F8" d="M-86.603,-50 L-86.603,150 L0,100 L0,0 L86.603,-50 L86.603,-150 Z"/>
        <path fill="#116EE3" d="M-173.205,-100 L-173.205,100 L-86.603,150 L-86.603,-50 Z"/>
      </g>
      <g style="opacity: var(--op, 1)">
        <path fill="#B598FA" d="M0,-400 L173.205,-300 L259.808,-350 L86.603,-450 Z"/>
        <path fill="#9F84F1" d="M173.205,-300 L173.205,0 L259.808,-50 L259.808,-350 Z"/>
        <path fill="#7E66DA" d="M0,-400 L0,-200 L86.603,-150 L86.603,-50 L173.205,0 L173.205,-300 Z"/>
      </g>
      <g style="opacity: var(--om, 1)">
        <path fill="#7CEACD" d="M0,0 L259.808,150 L346.410,100 L259.808,50 L433.013,-50 L259.808,-150 L259.808,-50 L173.205,0 L86.603,-50 Z"/>
        <path fill="#54CFB6" d="M259.808,150 L259.808,250 L346.410,200 L346.410,100 Z"/>
        <path fill="#38C0A6" d="M0,0 L0,100 L259.808,250 L259.808,150 Z"/>
        <path fill="#54CFB6" d="M259.808,50 L346.410,100 L433.013,50 L433.013,-50 Z"/>
      </g>
    </g>
  </symbol>
</svg>

<div class="app" id="app" data-view="room">
  <header class="top">
    <span class="brand"><svg class="mark" id="liveMark" viewBox="0 0 512 512" aria-hidden="true"><use href="#mark"/></svg><span class="wordmark" aria-label="Toryo">TŌRYŌ</span></span>
    <div class="deskchips" id="deskchips"></div>
    <button class="iconbtn" id="themeBtn" type="button" title="Theme"></button>
    <button class="iconbtn" id="bellBtn" type="button" title="Browser notifications"></button>
    <button class="iconbtn" id="settingsBtn" type="button" title="Settings" aria-label="Settings"></button>
  </header>

  <div class="desk">
    <aside class="rail" id="rail" aria-label="Rooms">
      <div class="rooms" id="rooms"></div>
      <button class="btn" id="newRoomBtn" type="button">New room</button>
      <div class="railfoot">
        <p class="eyebrow">What the rings mean</p>
        <div class="legend">
          <span><i style="--c: var(--build)"></i>Building</span><span><i style="--c: var(--review)"></i>Reviewing</span>
          <span><i style="--c: var(--plan)"></i>Planning</span><span><i style="--c: var(--you)"></i>Needs you</span>
        </div>
      </div>
    </aside>

    <main id="view">
      <div class="room" id="main" data-tab="relay">
        <div class="relay">
          <header class="roomhead" id="roomhead" hidden>
            <span class="tile" id="roomTile" aria-hidden="true"></span>
            <div class="rh-title">
              <div class="rh-name"><h1><button class="roomtitle" id="roomTitle" type="button" title="Room settings, rename or delete"></button></h1><span class="muted" id="roomWhere"></span></div>
              <div class="rh-state" id="rhState"></div>
            </div>
            <div class="seg" id="modes" role="group" aria-label="Room mode">
              <button type="button" data-mode="chat" aria-pressed="false" title="Talk with one agent or several"></button>
              <button type="button" data-mode="plan" aria-pressed="false" title="Independent proposals, critiques, your call, a written plan"></button>
              <button type="button" data-mode="build" aria-pressed="false" title="One builds, the other reviews, slice by slice"></button>
            </div>
            <div class="rh-actions">
              <button class="btn" id="pauseBtn" type="button">Pause</button>
              <button class="btn quiet danger" id="stopBtn" type="button">Stop</button>
              <button class="btn quiet" id="roomBtn" type="button" title="Rename, change settings or delete this room">Room</button>
            </div>
          </header>
          <div class="seg roomtabs" id="roomtabs" role="tablist" aria-label="Room sections" hidden>
            <button type="button" role="tab" data-roomtab="relay" aria-selected="true">Relay</button>
            <button type="button" role="tab" data-roomtab="plan" aria-selected="false">Plan</button>
            <button type="button" role="tab" data-roomtab="crew" aria-selected="false">Crew</button>
            <button type="button" role="tab" data-roomtab="ledger" aria-selected="false">Ledger</button>
          </div>
          <div class="log" id="log" aria-live="polite"></div>
          <form class="composer" id="composer" autocomplete="off" hidden>
            <div class="route">
              <span class="seg" id="recipients" role="group" aria-label="Send to"></span>
              <span class="routeinfo" id="routeInfo"></span>
            </div>
            <div class="compose-row">
              <textarea id="msg" rows="2" placeholder="Write to the crew. @codex or @claude to address one; Enter to send, Shift+Enter for a new line."></textarea>
              <div class="compose-side">
                <span class="seg" id="intent" role="group" aria-label="Ask or tell" title="Ask: it's a question and needs an answer. Tell: an instruction, acted on without a separate reply. Chosen from what you write until you pick one."><button type="button" data-intent="ask" aria-pressed="false">Ask</button><button type="button" data-intent="tell" aria-pressed="true">Tell</button></span>
                <select id="delivery" aria-label="When to deliver">
                  <option value="next">At its next turn</option>
                  <option value="now">Now (interrupts)</option>
                </select>
                <button class="btn primary" type="submit" id="sendBtn">Send</button>
              </div>
            </div>
            <div class="opts" id="composeOpts">
              <label id="discussOpt"><input type="checkbox" id="discuss"> Let them discuss <select id="discussRounds" aria-label="Discussion rounds"><option>1</option><option selected>2</option><option>3</option><option>4</option></select> rounds</label>
              <label id="writeOpt"><input type="checkbox" id="allowWrite"> Allow file changes</label>
              <span class="hint" id="composeHint"></span>
            </div>
          </form>
        </div>
        <aside class="side" id="side" aria-label="Plan, crew and ledger">
          <div class="seg sidetabs" id="sidetabs" role="tablist" aria-label="Plan, crew and ledger">
            <button type="button" role="tab" data-sidetab="plan" aria-selected="true">Plan</button>
            <button type="button" role="tab" data-sidetab="crew" aria-selected="false">Crew</button>
            <button type="button" role="tab" data-sidetab="ledger" aria-selected="false">Ledger</button>
          </div>
          <div class="sidebody" id="sidebody">
            <div class="panel-plan" id="context" data-panel="plan"></div>
            <div class="panel-crew" id="crewPane" data-panel="crew"></div>
            <div class="panel-ledger" id="ledger" data-panel="ledger"></div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button type="button" data-view="rooms"></button>
    <button type="button" data-view="room"></button>
  </nav>
</div>

<div class="scrim" id="sheet" hidden><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
