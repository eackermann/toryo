  function fillHex() {
    const cs = getComputedStyle(document.documentElement);
    $$("[data-hex]").forEach((el) => { el.textContent = cs.getPropertyValue(el.dataset.hex).trim(); });
  }

  // ---------- Rendering ----------
  function render() {
    const app = $("#app");
    app.dataset.view = S.view;
    renderTop();
    renderRail();
    renderTabbar();
    const v = $("#view");
    if (S.view === "home" || S.view === "rooms") v.innerHTML = renderHome();
    else if (S.view === "system") { v.innerHTML = renderSystem(); fillHex(); }
    else if (S.view === "room") {
      v.innerHTML = renderRoom(room(S.room));
      const log = $("#log");
      log.scrollTop = log.scrollHeight;
    }
  }
  // Refresh everything but the room's composer and scroll, so typing is never lost.
  function refresh() {
    renderTop();
    renderRail();
    renderTabbar();
    if (S.view === "home") $("#view").innerHTML = renderHome();
    if (S.view === "room") {
      const r = room(S.room);
      const log = $("#log");
      const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      const head = $(".roomhead .tile");
      if (head) head.outerHTML = tile(r, 44);
      $("#rhState").innerHTML = stateSentence(r);
      const pauseBtn = $('.rh-actions [data-act="roompause"]');
      if (pauseBtn) pauseBtn.innerHTML = `${ic(r.paused ? "play" : "pause")}<span class="lbl">${r.paused ? "Resume" : "Pause"}</span>`;
      log.innerHTML = renderLog(r);
      if (!r.away) $(".away")?.replaceWith(document.createElement("div"));
      if (atEnd) log.scrollTop = log.scrollHeight;
      $("#sidebody").innerHTML = sideBody(r);
      $("#routeInfo").innerHTML = routeText(r);
    }
  }
  function tick() {
    const now = Date.now();
    $$("[data-since]").forEach((el) => {
      const t = Number(el.dataset.since);
      el.textContent = fmtTime(el.dataset.fmt, now - t);
    });
  }
  setInterval(tick, 1000);

  function toast(title, text = "", k = "") {
    const el = document.createElement("div");
    el.className = "toast";
    if (k) el.dataset.k = k;
    el.innerHTML = `${ic(k === "you" ? "hand" : k === "build" ? "build" : k === "plan" ? "plan" : "check")}<span><b>${esc(title)}</b>${esc(text)}</span>`;
    $("#toasts").append(el);
    setTimeout(() => { el.style.transition = "opacity 300ms"; el.style.opacity = "0"; setTimeout(() => el.remove(), 320); }, 3600);
  }
  function feed(k, roomId, text) { S.feed.push({ at: Date.now(), k, room: roomId, text }); }

  // ---------- Routing ----------
  function route() {
    const h = (location.hash || "#home").slice(1);
    if (h === "system") S.view = "system";
    else if (h === "rooms") S.view = "rooms";
    else if (h.startsWith("r-") && room(h.slice(2))) {
      if (S.room !== h.slice(2)) { S.roomTab = "relay"; S.recipient = "auto"; S.intent = null; }
      S.room = h.slice(2);
      S.view = "room";
    } else if (h.startsWith("ds-")) { S.view = "system"; render(); document.getElementById(h)?.scrollIntoView({ behavior: "smooth" }); return; }
    else S.view = "home";
    render();
    $("#view").scrollTop = 0;
  }
  window.addEventListener("hashchange", route);

  // ---------- Actions ----------
  function answer(id, text) {
    const q = Q(id);
    if (!q || q.answered) return;
    const card = $$(`[data-q="${id}"]`);
    card.forEach((c) => c.classList.add("leaving"));
    setTimeout(() => {
      q.answered = true;
      q.answeredAt = Date.now();
      q.answer = text || `Go with your recommendation: ${q.rec}`;
      const r = room(q.room);
      if (q.then && !r.paused) {
        r.work = { kind: q.then.kind, agent: q.then.agent, since: Date.now(), lastOut: Date.now(), act: "Reading your answer" };
        r.slice.round += 1;
        r.events.push({ t: "turn", id: `live-${r.id}`, agent: q.then.agent, role: "builder", kind: "Building: your answer", live: true, since: Date.now(), lastOut: Date.now(), activity: ["Reading your answer", "Read docs/reviews/snapshots-round-4.md"] });
      }
      feed("answer", r.id, `You answered ${q.agent === "toryo" ? "the room" : A[q.agent].name}`);
      refresh();
      toast("Answer sent", q.then ? ` ${A[q.then.agent].name} carries on in ${r.name}.` : ` ${q.agent === "toryo" ? "The room" : A[q.agent].name} has it.`, q.then ? "build" : "review");
    }, 300);
  }
  function setPaused(r, how) {
    if (how) { r.prevWork = r.work; r.work = null; r.paused = how; r.pausedAt = Date.now(); }
    else { r.work = r.prevWork || null; r.prevWork = null; r.paused = null; if (r.work) { r.work.lastOut = Date.now(); } }
  }
  async function deskPause() {
    S.deskPausing = true;
    refresh();
    const n = S.rooms.filter((r) => r.work && !r.paused).length;
    toast("Pausing everything", `${n} turn${n === 1 ? " is" : "s are"} finishing. Nothing new starts.`, "");
    await wait(4200);
    S.rooms.filter((r) => r.work && !r.paused).forEach((r) => setPaused(r, "desk"));
    S.deskPausing = false;
    S.deskPaused = true;
    feed("pause", "toryo", "You paused everything");
    refresh();
  }
  function deskResume() {
    S.rooms.filter((r) => r.paused === "desk").forEach((r) => setPaused(r, null));
    S.deskPaused = false;
    refresh();
    toast("Everything resumed", "Rooms you paused yourself stay paused.", "build");
  }

  // The relay, played: Codex approves Slice 3, Claude builds Slice 4, checks run, Codex reviews.
  async function playRelay() {
    if (S.sim) return;
    const r = room("toryo");
    if (r.paused || S.deskPaused || S.deskPausing) { toast("Toryo main is paused", "Resume it to play the relay.", ""); return; }
    S.sim = true;
    $("#playBtn").disabled = true;
    if (!(S.view === "room" && S.room === "toryo") && S.view !== "home") location.hash = "#r-toryo";
    const live = () => r.events.find((e) => e.live);
    const step = async (lines, gap) => {
      for (const l of lines) {
        await wait(gap);
        const ev = live();
        if (!ev || !r.work) throw new Error("paused");
        ev.activity.push(l);
        ev.lastOut = Date.now();
        r.work.lastOut = Date.now();
        r.work.act = l.startsWith("Edit ") || l.startsWith("$ ") || l.startsWith("Read ") ? l : r.work.act;
        refresh();
      }
    };
    try { await relaySteps(r, live, step); } catch { toast("The relay stopped", " because the room or the desk was paused.", ""); }
    S.sim = false;
    $("#playBtn").disabled = false;
  }
  async function relaySteps(r, live, step) {
    const alive = () => { if (r.paused || S.deskPausing || S.deskPaused) throw new Error("paused"); };
    const until = (r.work && r.work.kind === "review") ? 0 : 1;
    if (until === 0) {
      await step(["✓ 19 tests passed", "Read test/boundary.test.mjs", "Writing the review"], 900);
      const ev = live();
      Object.assign(ev, { live: false, at: Date.now(), status: "APPROVED", files: 0, tokens: "880k in · 12k out", body: "<p>Approved. The outcome is now acted on as one step, saved once, and recovery can't repeat its effects. I checked each crash point with the tests and by reading <code>#actOnOutcome</code>.</p>" });
      const s3 = r.slices[2];
      s3.state = "done"; s3.took = Date.now() - r.slice.since;
      r.events.push({ t: "sys", at: Date.now(), html: `Slice 3 approved after ${shortDur(s3.took)} of work. Claude committed it locally.` });
      feed("approved", "toryo", `Slice 3 approved, after ${shortDur(s3.took)} of work`);
      r.work = null;
      refresh();
      toast("Slice 3 approved", ` ${shortDur(s3.took)} of work. Claude carries on with Slice 4.`, "review");
      await wait(1500);
      alive();
    }
    const n = r.slices.findIndex((s) => s.state === "todo");
    if (n < 0) return;
    const sl = r.slices[n];
    sl.state = "now";
    r.slice = { n: sl.n, round: 1, since: Date.now() };
    r.away = null;
    r.events.push({ t: "slice", n: sl.n, title: sl.title, note: "Started at " + clock(Date.now()) });
    r.events.push({ t: "turn", id: "live-toryo", agent: "claude", role: "builder", kind: "Build", live: true, since: Date.now(), lastOut: Date.now(), activity: ["Read docs/plans/plan-a-home-view-for-foreman-and-desk-wi.md"] });
    r.work = { kind: "build", agent: "claude", since: Date.now(), lastOut: Date.now(), act: "Read the plan" };
    feed("build", "toryo", `Claude started Slice ${sl.n}`);
    refresh();
    await step(["Read src/engine.mjs:1210-1290", "Edit src/engine.mjs", "Edit test/questions.test.mjs", "$ node --test test/questions.test.mjs", "Edit docs/reviews/home-slice-4-question-targets.md"], 1100);
    const b = live();
    Object.assign(b, { live: false, at: Date.now(), status: "REVIEW", files: 5, tokens: "940k in · 22k out", body: `<p>Every answer now names the room and the question it answers. An answer to a question that has moved on is refused and says so, instead of answering a different one.</p><div class="handoff">${ic("file")}<span class="mono">docs/reviews/home-slice-4-question-targets.md</span></div>` });
    r.events.push({ t: "checks", id: "chk", running: true, at: Date.now(), items: [{ name: "Syntax", ok: null, note: "running" }, { name: "Tests", ok: null, note: "waiting" }] });
    r.work = { kind: "checks", agent: null, since: Date.now(), lastOut: Date.now(), act: "$ node --test --test-concurrency=1 test/*.test.mjs" };
    refresh();
    await wait(1400);
    alive();
    const chk = r.events.find((e) => e.id === "chk");
    chk.items[0] = { name: "Syntax", ok: true, note: "1.8 s" }; chk.items[1] = { name: "Tests", ok: null, note: "running" };
    refresh();
    await wait(2200);
    alive();
    chk.items[1] = { name: "Tests", ok: true, note: "141 of 141 · 51 s" }; chk.running = false; chk.id = null;
    feed("checks", "toryo", "Checks passed: Syntax, Tests (141 of 141)");
    r.events.push({ t: "turn", id: "live-toryo", agent: "codex", role: "reviewer", kind: "Review", live: true, since: Date.now(), lastOut: Date.now(), activity: ["Read docs/reviews/home-slice-4-question-targets.md"] });
    r.work = { kind: "review", agent: "codex", since: Date.now(), lastOut: Date.now(), act: "Read the handoff" };
    feed("review", "toryo", `Codex started reviewing Slice ${sl.n}`);
    refresh();
    await step(["$ git diff --stat 9a0e113 44b7c0d", "Read src/engine.mjs:1210-1290"], 1200);
    $("#playBtn").textContent = "Play the next approval";
  }

  function sheet(html) {
    $("#sheetHost").innerHTML = `<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    $("#sheetHost .sheet").querySelector("button, select, input, textarea")?.focus();
  }
  function closeSheet() { $("#sheetHost").innerHTML = ""; }
  function newRoomSheet() {
    sheet(`<header><h2>New room</h2><button class="iconbtn" type="button" data-close title="Close">${ic("x")}</button></header>
      <div class="modecards">${[["chat", "Chat", "Talk with one agent or several."], ["plan", "Plan", "Proposals, critiques, your call, a written plan."], ["build", "Build", "One builds, another reviews, slice by slice."]].map(([m, t, d]) => `<button type="button" class="modecard" data-mode="${m}" data-newmode="${m}" aria-pressed="${m === "build"}">${ic(m)}<b>${t}</b><span>${d}</span></button>`).join("")}</div>
      <div class="formgrid">
        <label class="field" for="nrName">Name<input type="text" id="nrName" value="Re-skin"></label>
        <label class="field" for="nrProject">Project<select id="nrProject"><option>Toryo</option><option>Atlas</option></select></label>
        <label class="field" for="nrBuilder">Builder<select id="nrBuilder"><option>Claude</option><option>Codex</option><option>Codex app</option><option>Cursor</option></select></label>
        <label class="field" for="nrReviewer">Reviewer<select id="nrReviewer"><option>Codex</option><option>Claude</option><option>Cursor</option></select></label>
        <label class="field wide" for="nrPlan">Plan file<input type="text" id="nrPlan" value="docs/plans/reskin-and-design-system.md"></label>
        <label class="field wide" for="nrWhere">Where it works<select id="nrWhere"><option>Its own worktree (recommended)</option><option>This folder, shared</option></select></label>
      </div>
      <div class="actions" style="justify-content:flex-end"><button class="btn quiet" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-act="createroom">Create room</button></div>`);
  }
  function settingsSheet() {
    sheet(`<header><h2>Settings</h2><button class="iconbtn" type="button" data-close title="Close">${ic("x")}</button></header>
      <div class="settinglist">
        <div class="setting"><b>Usage guard</b><span>Holds an agent at 90% of its 5-hour or weekly limit and lets it go at the reset. Current turns always finish.</span><select id="setGuard" aria-label="Usage guard"><option>On at 90%</option><option>On at 80%</option><option>Off</option></select></div>
        <div class="setting"><b>Phone notifications</b><span>Through an ntfy topic, only when something needs you.</span><button class="btn sm" type="button" data-toast="A test notification went to your phone.">Send a test</button></div>
        <div class="setting"><b>Windows notifications</b><span>For questions and finished plans.</span><select id="setWin" aria-label="Windows notifications"><option>On</option><option>Off</option></select></div>
        <div class="setting"><b>Theme</b><span>Follows your system unless you choose.</span><select id="setTheme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
      </div>
      <div class="actions" style="justify-content:flex-end"><button class="btn primary" type="button" data-close>Done</button></div>`);
    $("#setTheme").value = theme;
  }

  // ---------- Theme ----------
  let theme = store.get("toryo-proto-theme") || "system";
  function applyTheme() {
    if (theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    $("#themeBtn").innerHTML = ic(theme === "dark" ? "moon" : theme === "light" ? "sun" : "system");
    $("#themeBtn").title = `Theme: ${theme === "system" ? "follow the system" : theme}. Click to change.`;
    if (S.view === "system") fillHex();
    themeStamp++;
  }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a, [data-close]");
    if (!t) return;
    if (t.matches("[data-close]") && (t === e.target.closest("[data-close]")) && (t.classList.contains("scrim") ? e.target === t : true)) { closeSheet(); return; }
    const d = t.dataset;
    if (d.answer) return answer(d.answer);
    if (d.write) { const w = t.closest(".ask").querySelector(".write"); w.hidden = !w.hidden; if (!w.hidden) w.querySelector("textarea").focus(); return; }
    if (d.sendAnswer) { const v = $(`#ans-${d.sendAnswer}`).value.trim(); if (!v) { $(`#ans-${d.sendAnswer}`).focus(); return; } return answer(d.sendAnswer, v); }
    if (d.toast) return toast(d.toast, "", "");
    if (d.recip) { S.recipient = d.recip; $$("[data-recip]").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); $("#routeInfo").innerHTML = routeText(room(S.room)); return; }
    if (d.intent) { S.intent = d.intent; $$("[data-intent]").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); return; }
    if (d.sidetab) { S.sideTab = d.sidetab; $$("[data-sidetab]").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); $("#sidebody").innerHTML = sideBody(room(S.room)); return; }
    if (d.roomtab) { S.roomTab = d.roomtab; if (d.roomtab !== "relay") S.sideTab = d.roomtab; $(".room").dataset.tab = d.roomtab; $$("[data-roomtab]").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); $("#sidebody").innerHTML = sideBody(room(S.room)); return; }
    if (d.newmode) { $$("[data-newmode]").forEach((b) => b.setAttribute("aria-pressed", String(b === t))); return; }
    if (d.mode && t.closest(".roomhead")) { toast(`Start a ${d.mode} round`, d.mode === "plan" ? " Proposals first, then critiques, then your call." : d.mode === "build" ? " Choose a plan file and who builds." : " Write to one agent or several.", d.mode === "plan" ? "plan" : "build"); return; }
    switch (d.act) {
      case "deskpause": return deskPause();
      case "deskresume": return deskResume();
      case "settings": return settingsSheet();
      case "newroom": return newRoomSheet();
      case "roompause": { const r = room(S.room); const was = !!r.paused; setPaused(r, was ? null : "you"); if (r.id === "trial" && was) r.events = r.events.filter((x) => x.t !== "notice"); feed("pause", r.id, was ? `You resumed ${r.name}` : `You paused ${r.name}`); refresh(); toast(was ? "Resumed" : "Paused", was ? ` ${r.name} carries on.` : " The current turn finishes; nothing new starts.", was ? "build" : ""); return; }
      case "dismissaway": { room(S.room).awayDismissed = true; t.closest(".away").remove(); const ph = document.createElement("div"); $(".relay .roomtabs").after(ph); return; }
      case "jump": { const el = $$("#log > *")[3]; el?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      case "createroom": {
        const name = $("#nrName").value.trim() || "New room";
        const mode = $("[data-newmode][aria-pressed='true']")?.dataset.newmode || "build";
        const id = "n" + Date.now();
        S.rooms.push({ id, name, short: name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(), project: $("#nrProject").value, folder: "~/.toryo/worktrees/" + $("#nrProject").value.toLowerCase() + "/" + name.toLowerCase().replace(/\W+/g, "-"), mode, crew: mode === "plan" ? { planners: ["claude", "codex"] } : mode === "chat" ? { members: ["claude", "codex"] } : { builder: "claude", reviewer: "codex", advisors: [] }, work: null, topic: name, step: 0, plan: name, sliceTotal: 3, sliceDone: 0, events: [{ t: "sys", at: Date.now(), html: `Room opened in its own worktree. Write to the crew to start.` }] });
        closeSheet();
        location.hash = "#r-" + id;
        toast("Room created", ` ${name} is ready.`, "build");
        return;
      }
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "delivery") { S.delivery = e.target.value; $("#routeInfo").innerHTML = routeText(room(S.room)); }
    if (e.target.id === "setTheme") { theme = e.target.value; store.set("toryo-proto-theme", theme); applyTheme(); }
    if (e.target.dataset.roleAgent) toast("Role changes after this round", " so nobody reviews their own work.", "");
  });
  document.addEventListener("input", (e) => {
    if (e.target.id !== "msg") return;
    if (S.intentManual) return;
    const ask = /\?\s*$|^(what|why|how|should|can|could|would|is|are|do|does)\b/i.test(e.target.value.trim());
    S.intent = ask ? "ask" : null;
    $$("[data-intent]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.intent === (ask ? "ask" : "tell"))));
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("#sheetHost").innerHTML) closeSheet();
    if (e.target.id === "msg" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "composer") return;
    e.preventDefault();
    const text = $("#msg").value.trim();
    if (!text) { $("#msg").focus(); return; }
    const r = room(S.room);
    const to = S.recipient === "auto" ? (r.crew.builder || members(r)[0]) : S.recipient;
    const target = to === "everyone" ? "everyone" : to;
    const waiting = r.paused ? "Waits until you resume the room" : target !== "everyone" && r.work && r.work.agent === target ? `With ${A[target].name}'s next turn, after this one` : target === "everyone" ? "With each agent's next turn" : `Waiting for ${A[target].name}'s next turn`;
    r.events.push({ t: "note", to: target, intent: S.intent === "ask" ? "ask" : "tell", at: Date.now(), text, state: waiting });
    $("#msg").value = "";
    S.intent = null;
    $$("[data-intent]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.intent === "tell")));
    refresh();
    const log = $("#log"); log.scrollTop = log.scrollHeight;
  });
  $("#themeBtn").addEventListener("click", () => {
    theme = theme === "system" ? "light" : theme === "light" ? "dark" : "system";
    store.set("toryo-proto-theme", theme);
    applyTheme();
    toast(`Theme: ${theme === "system" ? "follows your system" : theme}`, "", "");
  });
  $("#settingsBtn").innerHTML = ic("sliders");
  $("#settingsBtn").addEventListener("click", settingsSheet);
  $("#playBtn").addEventListener("click", playRelay);
  $("#resetBtn").addEventListener("click", () => { S = initialState(); $("#playBtn").textContent = "Play the relay"; $("#playBtn").disabled = false; route(); toast("Prototype reset", "", ""); });
  document.addEventListener("click", (e) => { if (e.target.closest("[data-intent]")) S.intentManual = true; }, true);
  document.addEventListener("submit", () => { S.intentManual = false; }, true);

  // Live mark keyframes, added here so they can use the registered properties.
  const kf = document.createElement("style");
  kf.textContent = "@keyframes mk-b { 50% { --ob: .42; } } @keyframes mk-p { 50% { --op: .42; } } @keyframes mk-m { 50% { --om: .42; } }";
  document.head.append(kf);

  applyTheme();
  route();
})();
</script>
