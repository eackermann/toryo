<title>Toryo Desk</title>
<!-- Toryo re-skin reference: the clickable prototype the owner approved on 13 Oct 2026. Sample data is made up. The "Prototype" bar is not part of the design. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: a building-site office. A rail of rooms, each tile ringed by what it's doing; Home is the site overview;
   a room is the relay, with its plan and crew beside it. Color means activity, never identity. */
:root {
  /* Activity hues come from the mark's three blocks. Orange is reserved for "needs you". */
  --paper: #f5f6fb;
  --surface: #ffffff;
  --sunk: #eef1f7;
  --line: #e1e6ef;
  --line-strong: #cdd4e2;
  --ink: #14233a;
  --ink-2: #46546d;
  --muted: #74819a;
  --plan: #8a6cf0; --plan-ink: #6145d4; --plan-soft: #f1edfe;
  --build: #2583f8; --build-ink: #1462cf; --build-soft: #e6f0fe;
  --review: #2bbf9f; --review-ink: #0b8a6f; --review-soft: #ddf5ef;
  --you: #ff7a1f; --you-ink: #c2520a; --you-soft: #ffeee1;
  --check: #6c7b95;
  --warn: #d99413; --warn-soft: #fbf2df;
  --bad: #dd4349; --bad-soft: #fde8e8;
  --tile: #e9edf6;
  --a-codex: #1c2c47; --a-claude: #8d5f4b; --a-cursor: #424b5c; --a-toryo: #ffffff;
  --on-tone: #ffffff;
  --shadow-1: 0 1px 2px rgb(20 35 58 / 0.06);
  --shadow-2: 0 1px 2px rgb(20 35 58 / 0.05), 0 10px 28px rgb(20 35 58 / 0.08);
  --scrim: rgb(20 35 58 / 0.34);
  /* Type: Lexend for names and numbers that matter, Figtree to read, JetBrains Mono for what the machine said. */
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
  /* Shape and motion */
  --r-control: 8px; --r-card: 12px; --r-sheet: 18px;
  --m-quick: 160ms; --m-settle: 320ms; --m-run: 2.8s; --m-breathe: 3.2s; --m-beacon: 1.7s; --m-march: 2.4s;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1220; --surface: #121b2c; --sunk: #0e1626; --line: #22304a; --line-strong: #31436a;
    --ink: #e8eef8; --ink-2: #b5c1d7; --muted: #8392ac;
    --plan: #a68bff; --plan-ink: #c3b0ff; --plan-soft: #221c43;
    --build: #4a9bff; --build-ink: #92c1ff; --build-soft: #12284a;
    --review: #3ed8b4; --review-ink: #7fe8cd; --review-soft: #0f302b;
    --you: #ff8f3d; --you-ink: #ffb27a; --you-soft: #3a2414;
    --check: #93a1ba; --warn: #f2b544; --warn-soft: #362a12; --bad: #ff6b70; --bad-soft: #3a1a1d;
    --tile: #1b2740; --a-codex: #2c3f62; --a-claude: #a3705a; --a-cursor: #536079; --a-toryo: #0e1626;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.35); --shadow-2: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.35);
    --scrim: rgb(3 8 18 / 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1220; --surface: #121b2c; --sunk: #0e1626; --line: #22304a; --line-strong: #31436a;
  --ink: #e8eef8; --ink-2: #b5c1d7; --muted: #8392ac;
  --plan: #a68bff; --plan-ink: #c3b0ff; --plan-soft: #221c43;
  --build: #4a9bff; --build-ink: #92c1ff; --build-soft: #12284a;
  --review: #3ed8b4; --review-ink: #7fe8cd; --review-soft: #0f302b;
  --you: #ff8f3d; --you-ink: #ffb27a; --you-soft: #3a2414;
  --check: #93a1ba; --warn: #f2b544; --warn-soft: #362a12; --bad: #ff6b70; --bad-soft: #3a1a1d;
  --tile: #1b2740; --a-codex: #2c3f62; --a-claude: #a3705a; --a-cursor: #536079; --a-toryo: #0e1626;
  --shadow-1: 0 1px 2px rgb(0 0 0 / 0.35); --shadow-2: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 32px rgb(0 0 0 / 0.35);
  --scrim: rgb(3 8 18 / 0.6);
  color-scheme: dark;
}

@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@property --ob { syntax: "<number>"; inherits: true; initial-value: 1; }
@property --op { syntax: "<number>"; inherits: true; initial-value: 1; }
@property --om { syntax: "<number>"; inherits: true; initial-value: 1; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--build); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.muted { color: var(--muted); }
.grow { flex: 1; }
.eyebrow { margin: 0; font: 600 11.5px/1.2 var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 600; text-wrap: balance; letter-spacing: -0.005em; }
h2 { font-size: 17px; line-height: 1.25; }
h3 { font-size: 15px; line-height: 1.3; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 14px; padding: 9px 18px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 2px; border: 0; background: none; cursor: pointer; text-decoration: none; border-radius: var(--r-control); }
.brand .mark { width: 30px; height: 30px; }
.wordmark { font: 700 17px/1 var(--f-display); letter-spacing: 0.09em; color: var(--ink); }
.topnav { display: flex; gap: 2px; padding: 3px; background: var(--sunk); border-radius: 10px; }
.topnav a { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; color: var(--ink-2); font-size: 13.5px; }
.topnav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.deskchips { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 12.5px/1.3 var(--f-body); white-space: nowrap; background: var(--sunk); color: var(--ink-2); border: 0; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip[data-k="you"] { background: var(--you-soft); color: var(--you-ink); cursor: pointer; text-decoration: none; }
.chip[data-k="work"] { background: var(--build-soft); color: var(--build-ink); }
.chip[data-k="guard"] { background: var(--sunk); color: var(--ink-2); }
.chip[data-k="paused"] { background: var(--sunk); color: var(--ink-2); outline: 1.5px dashed var(--line-strong); outline-offset: -1.5px; }
.iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-control); border: 1px solid transparent; background: none; cursor: pointer; color: var(--ink-2); }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }

.body { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 0; }
.rail { overflow: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 14px 12px 18px; display: flex; flex-direction: column; gap: 16px; }
#view { overflow: auto; min-width: 0; min-height: 0; }
.app[data-view="room"] #view { overflow: hidden; }

/* ---------- Buttons and controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 13px; border-radius: var(--r-control); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; line-height: 1.25; cursor: pointer; white-space: nowrap; transition: background var(--m-quick), border-color var(--m-quick), transform var(--m-quick); text-decoration: none; }
.btn:hover { background: var(--sunk); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.you { background: var(--you); border-color: var(--you); color: #1d1206; }
.btn.you:hover { filter: brightness(1.05); background: var(--you); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border-radius: 10px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 0; border-radius: 8px; background: none; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.seg button[data-mode="plan"][aria-pressed="true"] { color: var(--plan-ink); }
.seg button[data-mode="build"][aria-pressed="true"] { color: var(--build-ink); }
select, textarea, input[type="text"] { border: 1px solid var(--line-strong); border-radius: var(--r-control); background: var(--surface); padding: 7px 10px; }
select { padding-right: 28px; }
textarea { resize: vertical; width: 100%; line-height: 1.45; }
label.field { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }

/* ---------- Tiles and rings: the core of the system ---------- */
.tile { --size: 36px; --c: transparent; --rad: calc(var(--size) * 0.3); position: relative; display: inline-grid; place-items: center; flex: none; width: var(--size); height: var(--size); border-radius: var(--rad); background: var(--tile); color: var(--ink); font: 600 calc(var(--size) * 0.34)/1 var(--f-display); letter-spacing: 0.02em; isolation: isolate; }
.tile::before, .tile::after { content: ""; position: absolute; pointer-events: none; opacity: 0; transition: opacity var(--m-settle); }
.tile::before { inset: -5px; border-radius: calc(var(--rad) + 5px); box-shadow: 0 0 0 2px var(--c); }
.tile::after { inset: -10px; border-radius: calc(var(--rad) + 10px); box-shadow: 0 0 0 2px var(--you); }
.tile[data-ring="build"] { --c: var(--build); }
.tile[data-ring="review"] { --c: var(--review); }
.tile[data-ring="plan"] { --c: var(--plan); }
.tile[data-ring="needs"] { --c: var(--you); }
.tile[data-ring="done"] { --c: var(--review); }
.tile[data-ring="error"] { --c: var(--bad); }
/* Working: a sparkler runs around the tile over a faint track, throwing sparks; the halo breathes. */
.tile[data-ring="build"], .tile[data-ring="review"], .tile[data-ring="plan"] { animation: halo var(--m-breathe) ease-in-out infinite; animation-delay: var(--phb, 0s); }
.tile[data-ring="build"]::before, .tile[data-ring="review"]::before, .tile[data-ring="plan"]::before { opacity: 1; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 24%, transparent); }
.sparkler { position: absolute; pointer-events: none; z-index: 2; }
.tile[data-ring="needs"]::before { opacity: 1; animation: beacon var(--m-beacon) ease-out infinite; animation-delay: var(--phn, 0s); }
.tile[data-ring="done"]::before, .tile[data-ring="error"]::before { opacity: 1; }
.tile[data-ring="checks"]::before { opacity: 1; box-shadow: none; padding: 2px; background: conic-gradient(from var(--spin), var(--check) 0 16%, transparent 0 25%, var(--check) 0 41%, transparent 0 50%, var(--check) 0 66%, transparent 0 75%, var(--check) 0 91%, transparent 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: march var(--m-march) linear infinite; animation-delay: var(--phm, 0s); }
.tile[data-ring="paused"]::before { opacity: 1; box-shadow: none; border: 2px dashed var(--muted); }
.tile[data-ring="held"]::before { opacity: 1; box-shadow: none; border: 2px dotted var(--ink-2); }
.tile[data-needs]::after { opacity: 1; animation: beacon-out var(--m-beacon) ease-out infinite; animation-delay: var(--phn, 0s); }
.tile .badge { position: absolute; right: -7px; bottom: -7px; z-index: 1; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1.5px var(--line-strong); color: var(--ink-2); }
.tile .badge svg { width: 11px; height: 11px; stroke-width: 2.4; }
.tile[data-ring="done"] .badge { background: var(--review-ink); color: var(--surface); box-shadow: none; }
.tile[data-ring="error"] .badge { background: var(--bad); color: var(--surface); box-shadow: none; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 2px var(--c), 0 0 0 3px color-mix(in srgb, var(--c) 26%, transparent), 0 0 10px 0 color-mix(in srgb, var(--c) 22%, transparent); }
  50% { box-shadow: 0 0 0 2px var(--c), 0 0 0 8px color-mix(in srgb, var(--c) 7%, transparent), 0 0 22px 3px color-mix(in srgb, var(--c) 12%, transparent); }
}
@keyframes halo {
  0%, 100% { box-shadow: 0 0 10px -3px color-mix(in srgb, var(--c) 28%, transparent); }
  50% { box-shadow: 0 0 24px 2px color-mix(in srgb, var(--c) 20%, transparent); }
}
@keyframes beacon {
  0% { box-shadow: 0 0 0 2px var(--c), 0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent); }
  75%, 100% { box-shadow: 0 0 0 2px var(--c), 0 0 0 12px color-mix(in srgb, var(--c) 0%, transparent); }
}
@keyframes beacon-out {
  0% { box-shadow: 0 0 0 2px var(--you), 0 0 0 2px color-mix(in srgb, var(--you) 55%, transparent); }
  75%, 100% { box-shadow: 0 0 0 2px var(--you), 0 0 0 10px color-mix(in srgb, var(--you) 0%, transparent); }
}
@keyframes march { to { --spin: 360deg; } }

/* Agents: told apart by name and monogram, never by activity color. */
.av { --size: 30px; color: var(--on-tone); background: var(--a-codex); font-size: calc(var(--size) * 0.36); }
.av[data-agent="claude"] { background: var(--a-claude); }
.av[data-agent="cursor"] { background: var(--a-cursor); }
.av[data-agent="toryo"] { background: var(--a-toryo); box-shadow: inset 0 0 0 1px var(--line); }
.av[data-agent="toryo"] svg { width: 70%; height: 70%; }
.av .app { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 3px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--a-codex); }

/* ---------- Rail ---------- */
.railitem { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.railitem:hover { background: var(--sunk); }
.railitem[aria-current="page"] { background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.railitem .ri-text { display: grid; min-width: 0; }
.railitem .ri-name { font-weight: 600; font-size: 14px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.railitem .ri-state { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.railitem .ri-state[data-k="you"] { color: var(--you-ink); font-weight: 600; }
.railitem.railhome .homeico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--tile); }
.railitem .count { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--you); color: #1d1206; font: 700 12px/1.5 var(--f-display); text-align: center; }
.railgroup { display: grid; gap: 4px; }
.railgroup .eyebrow { padding: 0 10px 4px; }
.railgroup .railitem { padding-block: 7px; }
.railfoot { margin-top: auto; display: grid; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--line); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 2px var(--c); }

/* ---------- Home ---------- */
.home { padding: 22px 28px 96px; display: grid; gap: 22px; max-width: 1360px; margin-inline: auto; }
.hero { position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 26px 28px; border-radius: var(--r-sheet); background: var(--surface); border: 1px solid var(--line); }
.hero .iso { position: absolute; right: -40px; top: -60px; width: 520px; height: 320px; pointer-events: none; opacity: 0.9; }
.hero-text { position: relative; display: grid; gap: 8px; max-width: 640px; }
.hero h1 { font-size: clamp(24px, 3vw, 32px); line-height: 1.12; font-weight: 600; letter-spacing: -0.015em; }
.hero h1 em { font-style: normal; color: var(--you-ink); }
.hero .lede { margin: 0; color: var(--ink-2); max-width: 60ch; }
.deskbar { position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.col { display: grid; gap: 22px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; }
.panel > header .count { padding: 0 8px; border-radius: 999px; font: 700 12px/1.6 var(--f-display); background: var(--sunk); color: var(--ink-2); }
.panel.needs > header .count { background: var(--you); color: #1d1206; }
.panel > header .hnote { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.empty { padding: 18px; border-radius: 10px; background: var(--sunk); color: var(--ink-2); display: flex; gap: 12px; align-items: center; }

.ask { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid color-mix(in srgb, var(--you) 45%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--you) 9%, transparent); transition: opacity var(--m-settle), transform var(--m-settle); }
.ask > header { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ask .who { display: grid; min-width: 0; }
.ask .who strong { font-family: var(--f-display); font-weight: 600; }
.ask .who .muted { font-size: 12.5px; }
.ask .wait { margin-left: auto; font-size: 12.5px; color: var(--you-ink); font-weight: 600; white-space: nowrap; }
.ask .q { margin: 0; font: 500 16px/1.4 var(--f-display); letter-spacing: -0.005em; }
.ask .ctx { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.rec { display: grid; gap: 3px; padding: 10px 12px; border-radius: 10px; background: var(--you-soft); }
.rec .eyebrow { color: var(--you-ink); }
.rec p { margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ask .write { display: grid; gap: 8px; }
.ask.answered { border-color: var(--line); box-shadow: none; background: var(--sunk); }
.ask.answered .q { font-size: 14.5px; color: var(--ink-2); }
.answer { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
.answer svg { color: var(--review-ink); margin-top: 2px; }
.leaving { opacity: 0; transform: translateY(-6px) scale(0.99); }

.workcard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px 14px 18px; border-radius: var(--r-card); border: 1px solid var(--line); text-decoration: none; color: inherit; transition: border-color var(--m-quick), background var(--m-quick); }
.workcard:hover { border-color: var(--line-strong); background: color-mix(in srgb, var(--sunk) 50%, var(--surface)); }
.wc-main { display: grid; gap: 3px; min-width: 0; }
.wc-title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.wc-title strong { font: 600 15.5px/1.25 var(--f-display); }
.wc-title .muted { font-size: 12.5px; }
.wc-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 13.5px; }
.wc-act { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wc-time { display: grid; justify-items: end; gap: 2px; text-align: right; }
.wc-time .big { font: 500 20px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.wc-time .muted { font-size: 12px; }
.act-k { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-weight: 600; font-size: 12.5px; }
.act-k[data-k="build"] { background: var(--build-soft); color: var(--build-ink); }
.act-k[data-k="review"] { background: var(--review-soft); color: var(--review-ink); }
.act-k[data-k="plan"] { background: var(--plan-soft); color: var(--plan-ink); }
.act-k[data-k="checks"] { background: var(--sunk); color: var(--ink-2); }
.act-k[data-k="you"] { background: var(--you-soft); color: var(--you-ink); }
.act-k svg { width: 14px; height: 14px; }
.finishing { color: var(--muted); font-size: 12.5px; font-weight: 600; }

.usage { display: grid; gap: 18px; }
.allow { display: grid; gap: 10px; }
.allow + .allow { padding-top: 16px; border-top: 1px solid var(--line); }
.allow > header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.allow > header strong { font: 600 14px/1.3 var(--f-display); }
.allow > header .muted { font-size: 12.5px; }
.win { display: grid; grid-template-columns: 78px minmax(0, 1fr) 44px; gap: 4px 10px; align-items: center; font-size: 13px; }
.win .lbl { color: var(--ink-2); }
.win .pct { text-align: right; font: 600 13px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.win .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.meter { --v: 0; --g: 90; position: relative; height: 8px; border-radius: 999px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * 1%); border-radius: inherit; background: var(--ink-2); transition: width var(--m-settle) var(--ease); }
.meter[data-level="warn"] .fill { background: var(--warn); }
.meter[data-level="held"] .fill { background: var(--bad); }
.meter .guard { position: absolute; left: calc(var(--g) * 1%); top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--ink); }
.agentrows { display: grid; gap: 6px; }
.agentrow { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); }
.agentrow .av { --size: 22px; }
.agentrow b { color: var(--ink); font-weight: 600; }
.guardnote { margin: 0; font-size: 12.5px; color: var(--muted); }

.rowlist { display: grid; }
.roomrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 6px; border-radius: 10px; text-decoration: none; color: inherit; }
.roomrow + .roomrow { border-top: 1px solid var(--line); border-radius: 0; }
.roomrow:hover { background: var(--sunk); }
.roomrow .rr-text { display: grid; min-width: 0; }
.roomrow .rr-text strong { font-weight: 600; }
.roomrow .rr-text span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roomrow .rr-meta { font-size: 12px; color: var(--muted); text-align: right; }
.feed { display: grid; margin: 0; padding: 0; list-style: none; }
.feed li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; font-size: 13.5px; }
.feed li + li { border-top: 1px solid var(--line); }
.feed .fi { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--sunk); color: var(--ink-2); }
.feed .fi svg { width: 15px; height: 15px; }
.feed .fi[data-k="approved"], .feed .fi[data-k="review"] { background: var(--review-soft); color: var(--review-ink); }
.feed .fi[data-k="build"] { background: var(--build-soft); color: var(--build-ink); }
.feed .fi[data-k="plan"] { background: var(--plan-soft); color: var(--plan-ink); }
.feed .fi[data-k="you"] { background: var(--you-soft); color: var(--you-ink); }
.feed .ft { min-width: 0; }
.feed .ft a { color: var(--muted); text-decoration: none; font-size: 12.5px; }
.feed .ft a:hover { text-decoration: underline; }
.feed time { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ---------- Room ---------- */
.room { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 352px; }
.relay { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.roomhead { display: flex; align-items: center; gap: 16px; padding: 16px 24px 14px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rh-title { display: grid; gap: 4px; min-width: 0; flex: 1 1 280px; }
.rh-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rh-name h1 { font-size: 21px; line-height: 1.2; }
.rh-name .muted { font-size: 13px; }
.rh-state { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); }
.rh-actions { display: flex; gap: 6px; align-items: center; }
.roomtabs { display: none; margin: 10px 24px 0; }
.away { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 24px 0; padding: 10px 14px; border-radius: 10px; background: var(--build-soft); color: var(--ink); font-size: 13.5px; }
.away svg { color: var(--build-ink); }
.away .grow { min-width: 0; }
.log { overflow: auto; padding: 18px 24px 24px; display: grid; align-content: start; gap: 14px; }
.log > * { width: 100%; max-width: 780px; margin-inline: auto; }
.sysline { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.sysline time { font: 12px/1.6 var(--f-mono); color: var(--muted); }
.slicemark { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 14px 0 4px; }
.slicemark .eyebrow { grid-row: span 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--sunk); color: var(--ink-2); font-size: 15px; letter-spacing: 0; }
.slicemark strong { font: 600 16px/1.3 var(--f-display); }
.slicemark .muted { font-size: 12.5px; }
.rounds { border: 1px dashed var(--line-strong); border-radius: var(--r-card); padding: 10px 14px; background: color-mix(in srgb, var(--sunk) 60%, transparent); }
.rounds summary { cursor: pointer; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; list-style: none; }
.rounds summary::-webkit-details-marker { display: none; }
.rounds summary b { font-weight: 600; }
.rounds summary .chev { margin-left: auto; transition: transform var(--m-quick); }
.rounds[open] summary .chev { transform: rotate(180deg); }
.rounds ol { margin: 10px 0 2px; padding-left: 20px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }

.turn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 16px; display: grid; gap: 10px; box-shadow: var(--shadow-1); }
.turn > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.turn .name { font: 600 14.5px/1.2 var(--f-display); }
.turn .kind { font-size: 12.5px; color: var(--muted); }
.turn .when { font: 12px/1 var(--f-mono); color: var(--muted); }
.role { padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; background: var(--sunk); color: var(--ink-2); }
.role[data-role="builder"] { background: var(--build-soft); color: var(--build-ink); }
.role[data-role="reviewer"] { background: var(--review-soft); color: var(--review-ink); }
.role[data-role="planner"] { background: var(--plan-soft); color: var(--plan-ink); }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.status svg { width: 13px; height: 13px; stroke-width: 2.4; }
.status[data-s="REVIEW"], .status[data-s="review"] { background: var(--review-soft); color: var(--review-ink); }
.status[data-s="CHANGES"], .status[data-s="build"] { background: var(--build-soft); color: var(--build-ink); }
.status[data-s="plan"], .status[data-s="PROPOSAL"] { background: var(--plan-soft); color: var(--plan-ink); }
.status[data-s="APPROVED"], .status[data-s="DONE"] { background: var(--review-ink); color: var(--surface); }
.status[data-s="OWNER"] { background: var(--you-soft); color: var(--you-ink); }
.status .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.turn .body { display: grid; gap: 8px; }
.turn .body p, .turn .body ul, .turn .body ol { margin: 0; }
.turn .body ul, .turn .body ol { padding-left: 20px; display: grid; gap: 4px; }
.turn .body code { font: 0.86em var(--f-mono); background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.handoff { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-size: 13px; color: var(--ink-2); }
.turn > footer { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding-top: 8px; border-top: 1px solid var(--line); }
.turn > footer .link { border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.turn.live { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 8%, transparent); }
.turn.live[data-k="build"] { --c: var(--build); }
.turn.live[data-k="review"] { --c: var(--review); }
.turn.live[data-k="plan"] { --c: var(--plan); }
.activity { margin: 0; padding: 10px 12px; list-style: none; display: grid; gap: 5px; border-radius: 8px; background: var(--sunk); font: 12.5px/1.45 var(--f-mono); color: var(--ink-2); max-height: 190px; overflow: auto; }
.activity li { display: flex; gap: 8px; align-items: flex-start; min-width: 0; animation: arrive var(--m-settle) var(--ease); }
.activity li svg { width: 14px; height: 14px; margin-top: 1px; color: var(--muted); }
.activity li span { overflow-wrap: anywhere; }
.activity li:last-child { color: var(--ink); }
@keyframes arrive { from { opacity: 0; transform: translateY(4px); } }
.checks { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.checks .ttl { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.checks .tile { --size: 22px; background: var(--sunk); }
.chk { display: inline-flex; align-items: center; gap: 6px; }
.chk svg { width: 15px; height: 15px; stroke-width: 2.4; }
.chk[data-ok="true"] svg { color: var(--review-ink); }
.chk[data-ok="false"] svg { color: var(--bad); }
.chk .muted { font-size: 12px; }
.note { display: grid; gap: 6px; padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: var(--ink); color: var(--paper); }
.note .nh { display: flex; gap: 8px; align-items: center; font-size: 12px; opacity: 0.8; }
.note .ns { display: flex; gap: 6px; align-items: center; font-size: 12px; opacity: 0.85; }
.note p { margin: 0; }
.log > .note { width: fit-content; max-width: min(520px, 100%); margin-left: auto; margin-right: max(0px, calc((100% - 780px) / 2)); }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 14px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
.step { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.step i { height: 5px; border-radius: 999px; background: var(--sunk); }
.step[data-s="now"] { color: var(--plan-ink); font-weight: 600; }
.step[data-s="now"] i { background: var(--plan); animation: pulse 2.4s ease-in-out infinite; }
.step[data-s="done"] i { background: var(--plan); }
.step b { font: 600 13px/1.25 var(--f-display); color: var(--ink); }
.notice { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-card); border: 1.5px dashed var(--line-strong); color: var(--ink-2); }
.donecard { display: grid; gap: 12px; padding: 18px; border-radius: var(--r-card); background: var(--review-soft); }
.donecard h3 { display: flex; gap: 8px; align-items: center; color: var(--review-ink); }
.donecard ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; }

.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 24px 14px; display: grid; gap: 10px; }
.composer > * { width: 100%; max-width: 780px; margin-inline: auto; }
.route { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.routeinfo { font-size: 12.5px; color: var(--muted); }
.routeinfo b { color: var(--ink); }
.compose-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.compose-side { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
#msg { min-height: 46px; max-height: 180px; }

.side { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; min-height: 0; display: grid; align-content: start; }
.sidetabs { margin: 14px 16px 4px; display: flex; }
.sidetabs button { flex: 1; justify-content: center; }
.sidebody { padding: 10px 16px 28px; display: grid; gap: 14px; }
.progress { display: grid; gap: 8px; }
.progress .ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.progress .ph strong { font: 600 15px/1.3 var(--f-display); }
.segbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.segbar i { height: 7px; border-radius: 3px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.segbar i[data-s="done"] { background: var(--review); box-shadow: none; }
.segbar i[data-s="now"] { background: var(--build); box-shadow: none; animation: pulse 2.4s ease-in-out infinite; }
.segbar i[data-s="now-idle"] { background: var(--line-strong); box-shadow: none; }
.segbar i[data-s="now-review"] { background: var(--review); box-shadow: none; animation: pulse 2.4s ease-in-out infinite; }
.slices { list-style: none; margin: 0; padding: 0; display: grid; }
.slices li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 4px; font-size: 13.5px; border-radius: 8px; }
.slices li + li { border-top: 1px solid var(--line); border-radius: 0; }
.slices .si { position: relative; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; margin-top: 1px; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--muted); font: 600 10.5px/1 var(--f-display); }
.slices li[data-s="done"] .si { background: var(--review-ink); box-shadow: none; color: var(--surface); }
.slices li[data-s="done"] .si svg { width: 12px; height: 12px; stroke-width: 3; }
.slices li[data-s="now"] .si { --c: var(--build); color: var(--build-ink); }
.slices li[data-s="now"]:not([data-k="idle"]):not([data-k="checks"]) .si { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 25%, transparent); }
.slices li[data-s="now"][data-k="checks"] .si { box-shadow: 0 0 0 2px var(--check); }
.slices li[data-s="now"][data-k="review"] .si { --c: var(--review); color: var(--review-ink); }
.slices li[data-s="now"][data-k="checks"] .si { --c: var(--check); color: var(--ink-2); }
.slices li[data-s="now"] { background: var(--sunk); }
.slices li[data-s="now"] + li { border-top-color: transparent; }
.slices .st { display: grid; gap: 1px; min-width: 0; }
.slices .st small { color: var(--muted); font-size: 12px; }
.slices .sd { font: 500 12.5px/1.4 var(--f-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.slices li[data-s="done"] .sd { color: var(--review-ink); }
.crewcard { display: grid; gap: 12px; padding: 14px; border-radius: var(--r-card); border: 1px solid var(--line); }
.crewcard > header { display: flex; align-items: center; gap: 10px; }
.crewcard > header .av { --size: 34px; }
.crewcard .cn { display: grid; min-width: 0; }
.crewcard .cn strong { font: 600 15px/1.2 var(--f-display); }
.crewcard .cn span { font-size: 12.5px; color: var(--muted); }
.crewcard header select { margin-left: auto; padding-block: 4px; font-size: 13px; font-weight: 600; }
.crewcard .two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.crewcard .two select { width: 100%; font-size: 13px; }
.crewcard .hint { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.crewcard .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-left: -9px; }
.ledger { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ledger li { display: grid; gap: 4px; padding: 12px; border-radius: 10px; background: var(--sunk); font-size: 13.5px; }
.ledger li small { color: var(--muted); font-size: 12px; }
.sideintro { margin: 0; font-size: 13px; color: var(--ink-2); }

/* ---------- Design system ---------- */
.ds { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; padding: 28px 32px 110px; max-width: 1360px; margin-inline: auto; }
.ds-nav { position: sticky; top: 0; align-self: start; display: grid; gap: 2px; padding-top: 6px; }
.ds-nav a { padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 13.5px; }
.ds-nav a:hover { background: var(--sunk); color: var(--ink); }
.ds-body { display: grid; gap: 56px; min-width: 0; }
.ds section { display: grid; gap: 18px; scroll-margin-top: 20px; }
.ds section > header { display: grid; gap: 6px; max-width: 70ch; }
.ds section > header h2 { font-size: 24px; letter-spacing: -0.01em; }
.ds section > header p { margin: 0; color: var(--ink-2); }
.ds-cover { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: 34px; border-radius: var(--r-sheet); background: var(--surface); border: 1px solid var(--line); }
.ds-cover .mark { width: 120px; height: 120px; }
.ds-cover h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700; }
.ds-cover p { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; font-size: 15.5px; }
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.principle { padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.principle h3 { font-size: 15.5px; }
.principle p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.ringgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.ringspec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: center; padding: 18px 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
.ringspec .tile { --size: 44px; grid-row: span 3; margin: 6px; }
.ringspec strong { font: 600 14.5px/1.25 var(--f-display); }
.ringspec span { font-size: 12.5px; color: var(--ink-2); }
.ringspec code { font: 11.5px var(--f-mono); color: var(--muted); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw { display: grid; gap: 8px; }
.sw i { height: 64px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.06); }
.sw b { font: 600 13px/1.2 var(--f-display); }
.sw code { font: 11.5px/1.4 var(--f-mono); color: var(--muted); }
.sw .hex { color: var(--ink-2); }
.markstrip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.solid { display: grid; gap: 8px; padding: 14px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
.solid .faces { display: grid; grid-template-columns: repeat(3, 1fr); height: 48px; border-radius: 8px; overflow: hidden; }
.solid b { font: 600 14px/1.2 var(--f-display); }
.solid span { font-size: 12.5px; color: var(--ink-2); }
.typespec { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.typespec > div { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 14px 18px; }
.typespec > div + div { border-top: 1px solid var(--line); }
.typespec code { font: 11.5px/1.4 var(--f-mono); color: var(--muted); }
.compgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.comp { display: grid; gap: 12px; align-content: start; padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.comp > .eyebrow { margin-bottom: 2px; }
.comp .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.comp p { margin: 0; font-size: 13px; color: var(--ink-2); }
.tokentable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tokentable th, .tokentable td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tokentable th { font: 600 11.5px/1.2 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.tokentable code { font: 12px var(--f-mono); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.scale { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.scale div { display: grid; gap: 6px; justify-items: center; font: 11.5px var(--f-mono); color: var(--muted); }
.scale i { background: var(--build-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--build) 40%, transparent); border-radius: 3px; }

/* ---------- Sheets, toasts, prototype bar ---------- */

  }

  // ---------- Home ----------
  function isoArt() {
    const c = Math.cos(Math.PI / 6), s = 0.5, k = 26;
    const pt = (x, y, z) => `${((x - y) * c * k).toFixed(1)},${((x + y) * s * k - z * k).toFixed(1)}`;
    const box = (x, y, z, w, d, h, tone) => {
      const top = [pt(x, y, z + h), pt(x + w, y, z + h), pt(x + w, y + d, z + h), pt(x, y + d, z + h)];
      const right = [pt(x + w, y, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x + w, y, z + h)];
      const left = [pt(x, y + d, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x, y + d, z + h)];
      const f = (pct) => `fill: color-mix(in srgb, var(--${tone}) ${pct}%, var(--surface))`;
      return `<polygon points="${left.join(" ")}" style="${f(22)}"/><polygon points="${right.join(" ")}" style="${f(15)}"/><polygon points="${top.join(" ")}" style="${f(9)}"/>`;
    };
    return `<svg class="iso" viewBox="-260 -120 520 320" aria-hidden="true">
      ${box(2, -6, 0, 3, 3, 7, "plan")}${box(-4, -2, 0, 4, 3, 3, "build")}${box(5, 1, 0, 6, 2, 2, "review")}${box(8, -3, 0, 2, 4, 2, "review")}${box(-8, 4, 0, 3, 3, 4, "plan")}
    </svg>`;
  }
  function askCard(q, inRoom = false) {
    const r = room(q.room);
    const asker = q.agent === "toryo" ? "Toryo asks" : `${A[q.agent].name} asks`;
    if (q.answered) {
      return `<article class="ask answered" data-q="${q.id}">
        <header>${avatar(q.agent, 28)}<div class="who"><strong>${esc(asker)}</strong><span class="muted">${clock(q.at)}${q.answeredAt ? ` · answered at ${clock(q.answeredAt)}` : ""}</span></div></header>
        <p class="q">${esc(q.text)}</p><p class="answer">${ic("check")}<span>You: ${esc(q.answer)}</span></p></article>`;
    }
    return `<article class="ask" data-q="${q.id}">
      <header>${inRoom ? avatar(q.agent, 32) : tile(r, 40)}<div class="who"><strong>${inRoom ? esc(asker) : esc(r.name)}</strong><span class="muted">${inRoom ? "The room waits for your answer" : esc(asker)}</span></div><span class="wait">waiting ${timer(q.at, "wait")}</span></header>
      <p class="q">${esc(q.text)}</p>
      ${q.ctx ? `<p class="ctx">${esc(q.ctx)}</p>` : ""}
      ${q.rec ? `<div class="rec"><span class="eyebrow">Recommended</span><p>${esc(q.rec)}</p></div>` : ""}
      <div class="actions"><button class="btn you" type="button" data-answer="${q.id}">${ic("check")}Use the recommendation</button><button class="btn" type="button" data-write="${q.id}">Write my own answer</button>${inRoom ? "" : `<a class="btn quiet" href="#r-${r.id}">Open room</a>`}</div>
      <div class="write" hidden><label class="field" for="ans-${q.id}">Your answer</label><textarea id="ans-${q.id}" rows="2" placeholder="Answer ${esc(q.agent === "toryo" ? "the room" : A[q.agent].name)}…"></textarea><div class="actions"><button class="btn you" type="button" data-send-answer="${q.id}">Send answer</button></div></div>
    </article>`;
  }
  function workCard(r) {
    const w = r.work;
    const finishing = S.deskPausing;
    const kind = `<span class="act-k" data-k="${w.kind}">${ic(KIND_ICON[w.kind])}${w.kind === "checks" ? "Checks" : VERB[w.kind][0].toUpperCase() + VERB[w.kind].slice(1)}</span>`;
    return `<a class="workcard" href="#r-${r.id}">
      ${tile(r, 48)}
      <div class="wc-main">
        <div class="wc-title"><strong>${esc(r.name)}</strong><span class="muted">${esc(r.project)} · <span class="mono">${esc(r.folder)}</span></span></div>
        <div class="wc-line">${kind}<span><b>${esc(workers(r))}</b> · ${whatLine(r)}</span>${finishing ? `<span class="finishing">finishing, then pausing</span>` : ""}${openQs(r).length ? `<span class="act-k" data-k="you">Needs you too</span>` : ""}</div>
        <div class="wc-act mono">${esc(w.act || "")}</div>
      </div>
      <div class="wc-time"><span class="big">${timer(w.since, "dur")}</span><span class="muted">last output ${timer(w.lastOut || w.since, "ago")}</span></div>
    </a>`;
  }
  function meter(label, v, reset, read, guard = 90) {
    const level = v >= guard ? "held" : v >= 75 ? "warn" : "";
    const left = reset - Date.now();
    const d = new Date(reset);
    const resetText = left < 86400000 ? `resets in ${dur(left).replace(/:\d\d$/, "m").replace(/^(\d+)m$/, "$1m")} (${clock(reset)})` : `resets ${d.toLocaleDateString([], { weekday: "short" })} ${clock(reset)}`;
    return `<div class="win"><span class="lbl">${label}</span><div class="meter" style="--v:${v};--g:${guard}" ${level ? `data-level="${level}"` : ""} role="img" aria-label="${label}: ${v}% used; the guard holds at ${guard}%"><span class="fill"></span><span class="guard"></span></div><span class="pct">${v}%</span><span class="sub">${resetText} · read ${since(Date.now() - read)}</span></div>`;
  }
  function doing(agent) {
    const r = S.rooms.find((x) => x.work && !x.paused && (x.work.agent === agent || x.work.with === agent));
    if (!r) return `<span class="muted">idle</span>`;
    return `${VERB[r.work.kind]} in <a href="#r-${r.id}">${esc(r.name)}</a>`;
  }
  function renderHome() {
    const open = S.questions.filter((q) => !q.answered).sort((a, b) => a.at - b.at);
    const working = S.rooms.filter((r) => r.work && !r.paused);
    const others = S.rooms.filter((r) => !(r.work && !r.paused));
    const u = S.usage;
    let headline;
    if (S.deskPaused) headline = `Everything is paused.`;
    else if (working.length && open.length) headline = `${working.length} room${working.length > 1 ? "s are" : " is"} working, and <em>${open.length} question${open.length > 1 ? "s need" : " needs"} you</em>.`;
    else if (open.length) headline = `<em>${open.length} question${open.length > 1 ? "s need" : " needs"} you</em>. Nothing else is moving.`;
    else if (working.length) headline = `${working.length} room${working.length > 1 ? "s are" : " is"} working. Nothing needs you.`;
    else headline = `All quiet. Nothing is running, and nothing needs you.`;
    const lede = S.deskPausing ? "Pausing everything: current turns and checks finish, and nothing new starts." : S.deskPaused ? "Rooms you paused yourself stay paused when you resume." : "Codex is at 84% of its weekly limit; the guard holds it at 90% and lets it go when the week resets.";
    return `<div class="home">
      <section class="hero">
        ${isoArt()}
        <div class="hero-text"><p class="eyebrow">Home · ${new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</p><h1>${headline}</h1><p class="lede">${esc(lede)}</p></div>
        <div class="deskbar">
          ${S.deskPaused ? `<button class="btn primary" type="button" data-act="deskresume">${ic("play")}Resume everything</button>` : `<button class="btn" type="button" data-act="deskpause" ${S.deskPausing ? "disabled" : ""}>${ic("pause")}${S.deskPausing ? "Pausing…" : "Pause everything"}</button>`}
          <button class="btn quiet" type="button" data-act="settings">${ic("lock")}Usage guard</button>
        </div>
      </section>
      <div class="home-grid">
        <div class="col">
          <section class="panel needs" aria-labelledby="h-needs">
            <header><h2 id="h-needs">Needs you</h2>${open.length ? `<span class="count">${open.length}</span>` : ""}<span class="hnote">Oldest first</span></header>
            ${open.length ? open.map((q) => askCard(q)).join("") : `<div class="empty">${ic("check")}<span>Nothing needs you. Toryo rings orange when something does.</span></div>`}
          </section>
          <section class="panel" aria-labelledby="h-work">
            <header><h2 id="h-work">Working now</h2>${working.length ? `<span class="count">${working.length}</span>` : ""}<span class="hnote">Time is this turn's, not the slice's</span></header>
            ${working.length ? working.map(workCard).join("") : `<div class="empty">${ic("pause")}<span>No one is working right now.</span></div>`}
          </section>
          <section class="panel" aria-labelledby="h-other">
            <header><h2 id="h-other">Other rooms</h2></header>
            <div class="rowlist">${others.map((r) => {
              const st = railState(r);
              const meta = r.done ? "6 slices · 9h12m" : r.paused ? `paused ${since(Date.now() - (r.pausedAt || Date.now()))}` : "";
              return `<a class="roomrow" href="#r-${r.id}">${tile(r, 36)}<span class="rr-text"><strong>${esc(r.name)}</strong><span>${esc(st.text)} · ${esc(r.project)}${r.folder.includes("worktrees") ? " · own worktree" : ""}</span></span><span class="rr-meta">${esc(meta)}</span></a>`;
            }).join("")}</div>
          </section>
        </div>
        <div class="col">
          <section class="panel" aria-labelledby="h-usage">
            <header><h2 id="h-usage">Agents and usage</h2><span class="hnote">Guard at 90%</span></header>
            <div class="usage">
              <div class="allow"><header><strong>ChatGPT plan</strong><span class="muted">Codex and the Codex app share it</span></header>
                ${meter("5-hour", u.openai.five, u.openai.fiveReset, u.openai.read)}${meter("Weekly", u.openai.week, u.openai.weekReset, u.openai.read)}
                <div class="agentrows"><div class="agentrow">${avatar("codex", 22)}<b>Codex</b> ${doing("codex")}</div><div class="agentrow">${avatar("codexapp", 22)}<b>Codex app</b> ${doing("codexapp")}</div></div>
              </div>
              <div class="allow"><header><strong>Claude plan</strong><span class="muted">Max</span></header>
                ${meter("5-hour", u.anthropic.five, u.anthropic.fiveReset, u.anthropic.read)}${meter("Weekly", u.anthropic.week, u.anthropic.weekReset, u.anthropic.read)}${meter("Opus", u.anthropic.opus, u.anthropic.weekReset, u.anthropic.read)}
                <div class="agentrows"><div class="agentrow">${avatar("claude", 22)}<b>Claude</b> ${doing("claude")}</div></div>
              </div>
              <div class="allow"><header><strong>Cursor</strong><span class="muted">reports no limits</span></header>
                <div class="agentrows"><div class="agentrow">${avatar("cursor", 22)}<b>Cursor</b> advisor in 2 rooms · 14 turns today</div></div>
              </div>
              <p class="guardnote">The guard holds an agent once either limit reaches 90%, lets current turns finish, and releases it at the reset.</p>
            </div>
          </section>
          <section class="panel" aria-labelledby="h-recent">
            <header><h2 id="h-recent">Recent</h2></header>
            <ul class="feed">${S.feed.slice().sort((a, b) => b.at - a.at).slice(0, 9).map((f) => {
              const icon = { checks: "checks", plan: "plan", review: "review", you: "hand", build: "build", approved: "check", answer: "chat", pause: "pause" }[f.k] || "dots";
              const r = room(f.room);
              return `<li><span class="fi" data-k="${f.k}">${ic(icon)}</span><span class="ft">${esc(f.text)}<br><a href="#r-${r.id}">${esc(r.name)}</a></span><time>${timer(f.at, "ago")}</time></li>`;
            }).join("")}</ul>
          </section>
        </div>
      </div>
    </div>`;
  }

  // ---------- Room ----------
  function stateSentence(r) {
    const q = openQs(r);
    if (r.done) return `${ic("check")}<span>Plan done: 6 slices, 9h12m of work, final review approved by Codex.</span>`;
    if (r.paused) return `${ic("pause")}<span>${r.paused === "desk" ? "Paused with the desk. Resume everything from Home." : "Paused by you. Nothing starts until you resume."}</span>`;
    const parts = [];
    if (r.work) {
      const w = r.work;
      const who = w.kind === "checks" ? "Checks are running" : `${workers(r)} ${w.with ? "are" : "is"} ${VERB[w.kind]}`;
      parts.push(`<span class="act-k" data-k="${w.kind}">${ic(KIND_ICON[w.kind])}${w.kind === "checks" ? "Checks" : VERB[w.kind][0].toUpperCase() + VERB[w.kind].slice(1)}</span><span>${who}${r.slice ? ` Slice ${r.slice.n}${r.slice.round > 1 ? `, round ${r.slice.round}` : ""}` : r.mode === "plan" ? `: ${["independent proposals", "critiques", "your call", "the written plan", "one check"][r.step]}` : ""} · ${timer(w.since, "dur")}</span>`);
    }
    if (q.length) parts.push(`<span class="act-k" data-k="you">${ic("hand")}Needs you</span><span>${q.length === 1 ? "A question is waiting" : `${q.length} questions are waiting`}</span>`);
    if (!parts.length) parts.push(`<span>Idle. Write to the crew to start.</span>`);
    return parts.join("");
  }
  function turnCard(ev) {
    const live = ev.live;
    const kind = ev.plan ? "plan" : ev.role === "reviewer" ? "review" : "build";
    const status = ev.status ? `<span class="status" data-s="${ev.status}">${ev.status === "APPROVED" ? ic("check") : ""}${STATUS[ev.status]}</span>` : live ? `<span class="status" data-s="${kind}"><span class="pulse"></span>${kind === "plan" ? "Drafting" : kind === "review" ? "Reviewing" : "Building"}</span>` : "";
    const act = live ? `<ol class="activity">${ev.activity.map((line) => {
      const icon = line.startsWith("$ ") ? "term" : line.startsWith("Edit ") ? "edit" : line.startsWith("Read ") ? "file" : "sparkle";
      return `<li>${ic(icon)}<span>${esc(line.replace(/^\$ /, ""))}</span></li>`;
    }).join("")}</ol>` : "";
    const foot = live
      ? `<footer><span>Working for ${timer(ev.since, "dur")} · last output ${timer(ev.lastOut || ev.since, "ago")}</span><span class="grow"></span><button class="btn quiet sm" type="button" data-toast="Your note goes to ${esc(A[ev.agent].name)} mid-turn.">Interrupt with a note</button></footer>`
      : `<footer><button class="link" type="button" data-toast="Shows this turn's exact diff.">${ev.files ? `${ev.files} files changed` : "No file changes"}</button><span>${esc(ev.tokens || "")}</span><span class="grow"></span><button class="btn quiet sm" type="button" data-toast="Shows exactly what Toryo sent.">Prompt</button><button class="btn quiet sm" type="button" data-toast="Pick another agent to look at this message.">Second opinion</button></footer>`;
    return `<article class="turn ${live ? "live" : ""}" data-k="${kind}" ${ev.id ? `id="${ev.id}"` : ""}>
      <header>${avatar(ev.agent, 30, live ? kind : "")}<span class="name">${esc(A[ev.agent].name)}</span>${ev.role ? `<span class="role" data-role="${ev.role}">${ev.role[0].toUpperCase() + ev.role.slice(1)}</span>` : ""}<span class="kind">${esc(ev.kind)}</span>${ev.at ? `<span class="when">${clock(ev.at)}</span>` : ""}${status}</header>
      ${ev.body ? `<div class="body">${ev.body}</div>` : ""}${act}${foot}
    </article>`;
  }
  function eventHtml(ev, r) {
    switch (ev.t) {
      case "sys": return `<div class="sysline"><time>${clock(ev.at)}</time><span>${ev.html}</span></div>`;
      case "slice": return `<div class="slicemark"><span class="eyebrow">${ev.n}</span><strong>Slice ${ev.n}: ${esc(ev.title)}</strong><span class="muted">${esc(ev.note || "")}</span></div>`;
      case "rounds": return `<details class="rounds"><summary>${ic("dots")}<b>${esc(ev.label)}</b><span class="muted">${esc(ev.took)} · ${esc(ev.summary)}</span>${ic("chev", "i chev")}</summary><ol>${ev.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></details>`;
      case "question": return askCard(Q(ev.id), true);
      case "turn": return turnCard(ev);
      case "checks": return `<div class="checks"><span class="ttl"><span class="tile" ${ev.running ? 'data-ring="checks"' : ""} style="--size:22px">${ic("checks")}</span>${ev.running ? "Checks running" : "Checks passed"}</span>${ev.items.map((i) => `<span class="chk" data-ok="${i.ok}">${i.ok === null ? ic("clock") : i.ok ? ic("check") : ic("x")}${esc(i.name)} <span class="muted">${esc(i.note)}</span></span>`).join("")}</div>`;
      case "note": return `<div class="note"><span class="nh">${ev.intent === "ask" ? "Ask" : "Tell"} · You → ${esc(ev.to === "everyone" ? "everyone" : A[ev.to].name)} · ${clock(ev.at)}</span><p>${esc(ev.text)}</p><span class="ns">${ic(ev.state === "Replied" ? "check" : "clock")}${esc(ev.state)}</span></div>`;
      case "steps": return `<div class="steps">${["Independent proposals", "Critiques", "Your call", "The written plan", "One check"].map((s, i) => `<div class="step" data-s="${i < r.step ? "done" : i === r.step ? "now" : "todo"}"><i></i><b>${s}</b><span>${["Each drafts alone", "Each reads the other's", "Toryo collects the questions", "One author writes it", "Another planner checks it"][i]}</span></div>`).join("")}</div>`;
      case "notice": return `<div class="notice">${ic("pause")}<span>You paused this room ${since(Date.now() - r.pausedAt)}. Notes you send now wait for you to resume.</span><span class="grow"></span><button class="btn" type="button" data-act="roompause">${ic("play")}Resume</button></div>`;
      case "done": return `<div class="donecard"><h3>${ic("check")}Plan done</h3><p style="margin:0">All 6 slices approved in 9h12m of work, then a final review of the whole plan. Codex approved it.</p><ol>${["The relay and the status protocol (2h04m)", "Codex app threads (1h51m)", "Notes, Ask and Tell (1h12m)", "Snapshots and diffs (58m)", "Safety and read-only turns (1h40m)", "From your phone (1h27m)"].map((s) => `<li>${s}</li>`).join("")}</ol></div>`;
    }
    return "";
  }
  function renderLog(r) {
    return r.events.map((ev) => eventHtml(ev, r)).join("");
  }
  function sidePlan(r) {
    if (r.mode === "chat") return `<p class="sideintro">This is a chat room: no plan. Start a planning round with the Plan mode, or a build with a plan file.</p>`;
    if (r.mode === "plan") return `<div class="progress"><div class="ph"><strong>${esc(r.topic)}</strong></div><p class="sideintro">Planners: Claude and Codex. When both have proposed and critiqued, Toryo collects their questions into one form for you.</p></div>`;
    if (!r.slices) {
      const total = r.sliceTotal || 2, done = r.sliceDone || 0;
      return `<div class="progress"><div class="ph"><strong>${esc(r.plan)}</strong><span class="muted">${done} of ${total}</span></div><div class="segbar">${Array.from({ length: total }, (_, i) => `<i data-s="${i < done ? "done" : i === done && r.work ? "now" : "todo"}"></i>`).join("")}</div></div>`;
    }
    const done = r.slices.filter((s) => s.state === "done");
    const worked = done.reduce((t, s) => t + s.took, 0);
    const k = r.work && !r.paused ? r.work.kind : "idle";
    return `<div class="progress"><div class="ph"><strong>${esc(r.plan)}</strong><span class="muted num">${done.length} of ${r.slices.length}</span></div>
      <div class="segbar">${r.slices.map((s) => `<i data-s="${s.state === "now" ? (k === "review" ? "now-review" : k === "idle" ? "now-idle" : "now") : s.state}" title="Slice ${s.n}"></i>`).join("")}</div>
      <span class="muted" style="font-size:12.5px">${shortDur(worked)} of approved work so far</span></div>
      <ol class="slices">${r.slices.map((s) => `<li data-s="${s.state}" data-k="${s.state === "now" ? k : ""}"><span class="si">${s.state === "done" ? ic("check") : s.n}${s.state === "now" && RUNNING.has(k) ? sparkRing(20, 1, true) : ""}</span><span class="st"><span>${esc(s.title)}</span>${s.state === "now" ? `<small>${k !== "idle" ? (k === "checks" ? "Checks running" : `${workers(r)} ${VERB[k]}`) : r.paused ? "Paused" : "Waiting"} · round ${r.slice.round}</small>` : ""}</span><span class="sd">${s.state === "done" ? `(${shortDur(s.took)})` : s.state === "now" ? timer(r.slice.since, "dur") : ""}</span></li>`).join("")}</ol>`;
  }
  function sideCrew(r) {
    const members = [];
    if (r.crew.builder) members.push([r.crew.builder, "builder"]);
    if (r.crew.reviewer) members.push([r.crew.reviewer, "reviewer"]);
    (r.crew.planners || []).forEach((a) => members.push([a, "planner"]));
    (r.crew.members || []).forEach((a) => members.push([a, "member"]));
    (r.crew.advisors || []).forEach((a) => members.push([a, "advisor"]));
    const working = (a) => r.work && !r.paused && (r.work.agent === a || r.work.with === a);
    return members.map(([a, role]) => {
      const ag = A[a];
      const live = working(a) ? r.work.kind : "";
      const roles = r.mode === "build" ? ["builder", "reviewer", "advisor"] : [role];
      return `<div class="crewcard">
        <header>${avatar(a, 34, live)}<div class="cn"><strong>${esc(ag.name)}</strong><span>${live ? `${VERB[live][0].toUpperCase() + VERB[live].slice(1)} now` : role === "advisor" ? "Answers when you ask" : "Waiting for its turn"}</span></div>
          ${roles.length > 1 ? `<select aria-label="${esc(ag.name)}'s role" data-role-agent="${a}">${roles.map((x) => `<option ${x === role ? "selected" : ""}>${x[0].toUpperCase() + x.slice(1)}</option>`).join("")}</select>` : `<span class="role" data-role="${role}" style="margin-left:auto">${role[0].toUpperCase() + role.slice(1)}</span>`}</header>
        ${role === "advisor" ? `<p class="hint">Advisors aren't in the relay. They answer when you write to them, or when you ask for a second opinion, and they read the whole room each time.</p>` : ""}
        <div class="two"><select aria-label="${esc(ag.name)}'s model">${ag.models.map((m) => `<option ${m === ag.model ? "selected" : ""}>${esc(m)}</option>`).join("")}<option>Other…</option></select>${ag.efforts.length ? `<select aria-label="${esc(ag.name)}'s effort">${ag.efforts.map((e) => `<option ${e === ag.effort ? "selected" : ""}>${e}</option>`).join("")}</select>` : `<select disabled aria-label="Effort"><option>${a === "codexapp" ? "Set in the app" : "In the model name"}</option></select>`}</div>
        <div class="acts"><button class="btn quiet sm" type="button" data-toast="${esc(ag.name)} starts a new session on its next turn, with a briefing.">Start fresh</button><button class="btn quiet sm" type="button" data-toast="Resume command copied.">Copy resume command</button>${role === "advisor" ? `<button class="btn quiet sm danger" type="button" data-toast="${esc(ag.name)} left the room. Add it back under More agents.">Remove</button>` : ""}</div>
      </div>`;
    }).join("");
  }

  // ---------- Design system ----------

            <div class="comp"><p class="eyebrow">Usage meter</p>${meter("Weekly", 84, Date.now() + 2 * 86400000, Date.now() - 180000)}${meter("5-hour", 92, Date.now() + 40 * 60000, Date.now() - 60000)}<p>The tick is the guard. Amber from 75%; red once the guard holds the agent.</p></div>
